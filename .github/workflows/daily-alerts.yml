# Runs the price alert twice each weekday in the cloud, for free.
# GitHub schedules use UTC and ignore daylight saving, so each check is listed
# twice (summer and winter time). The script itself only acts inside the
# New York time windows in config/strategy.json and never runs twice per session.
#   Open check  ~9:45 AM New York  (6:45 AM Pacific)
#   Close check ~3:30 PM New York  (12:30 PM Pacific)
# GitHub can start scheduled runs 5-20 minutes late; the windows allow for that.
name: Daily price alerts

on:
  schedule:
    - cron: "45 13 * * 1-5"   # open, summer time
    - cron: "45 14 * * 1-5"   # open, winter time
    - cron: "30 19 * * 1-5"   # close, summer time
    - cron: "30 20 * * 1-5"   # close, winter time
  workflow_dispatch:          # lets you press "Run workflow" to test

permissions:
  contents: write             # to save alert history back to the repo

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check prices and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/price_alert.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Refresh dashboard
        run: python scripts/build_dashboard.py
      - name: Save alert history
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alert_state.json data/alert_log.csv docs/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Alert log $(date -u +%F)" && git push)
