# Runs the price alert on GitHub, for free. No AI involved.
# GitHub can start scheduled runs late (on 2026-10-05 by about 2 hours) or skip them,
# so each alert window gets 3 tries. These UTC times land inside the New York windows
# in config/strategy.json in both summer and winter time:
#   Open window  09:35-12:00 New York: tries at 14:40, 15:20, 15:55 UTC
#                (summer 10:40, 11:20, 11:55 / winter 9:40, 10:20, 10:55)
#   Close window 15:00-17:30 New York: tries at 20:05, 20:45, 21:25 UTC
#                (summer 4:05, 4:45, 5:25 PM / winter 3:05, 3:45, 4:25 PM)
# The first try that finishes marks the window done; scripts/alert_gate.py then
# stops the later tries before anything is installed.
name: Daily price alerts

on:
  schedule:
    - cron: "40 14 * * 1-5"   # open, try 1
    - cron: "20 15 * * 1-5"   # open, try 2
    - cron: "55 15 * * 1-5"   # open, try 3
    - cron: "5 20 * * 1-5"    # close, try 1
    - cron: "45 20 * * 1-5"   # close, try 2
    - cron: "25 21 * * 1-5"   # close, try 3
  workflow_dispatch:          # lets you press "Run workflow" to test
    inputs:
      test_notification:
        description: "Also send a test push/email (checks the GitHub secrets reach your phone)"
        type: boolean
        default: false

permissions:
  contents: write             # to save alert history back to the repo

# If GitHub starts two tries at once, run them one after the other, so the
# second sees the first one's saved state and skips instead of alerting twice.
concurrency:
  group: daily-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this window already ran
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        run: python3 scripts/alert_gate.py
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.run != 'false' }}
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ steps.gate.outputs.run != 'false' }}
      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/notify.py --test
      - name: Check prices and send alerts
        if: ${{ steps.gate.outputs.run != 'false' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/price_alert.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Refresh dashboard
        if: ${{ steps.gate.outputs.run != 'false' }}
        run: python scripts/build_dashboard.py
      - name: Save alert history
        if: ${{ steps.gate.outputs.run != 'false' }}
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alert_state.json data/alert_log.csv docs/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Alert log $(date -u +%F)" && git push)
